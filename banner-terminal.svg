<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <style>
    text{font-family:'JetBrains Mono','Fira Code','DejaVu Sans Mono','Courier New',monospace}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .glow{filter:drop-shadow(0 0 6px rgba(74,222,128,.55))}
    .rain1{animation:rain 9s linear infinite}
    .rain2{animation:rain 13s linear infinite -4s}
    .rain3{animation:rain 11s linear infinite -7s}
    @keyframes rain{from{transform:translateY(-260px)}to{transform:translateY(380px)}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(370px)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <defs>
    <clipPath id="win"><rect x="20" y="20" width="1160" height="320" rx="12"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B0F"/>
      <stop offset="100%" stop-color="#0B1410"/>
    </linearGradient>

    <clipPath id="c1"><rect x="60" y="76" height="28" width="0"><animate attributeName="width" values="0;0;304;304;0" keyTimes="0;.03;.10;.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="106" height="56" width="0"><animate attributeName="width" values="0;0;500;500;0" keyTimes="0;.12;.20;.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="168" height="26" width="0"><animate attributeName="width" values="0;0;600;600;0" keyTimes="0;.21;.31;.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="60" y="212" height="28" width="0"><animate attributeName="width" values="0;0;396;396;0" keyTimes="0;.35;.44;.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="60" y="250" height="26" width="0"><animate attributeName="width" values="0;0;684;684;0" keyTimes="0;.45;.60;.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="60" y="292" height="28" width="0"><animate attributeName="width" values="0;0;224;224;0" keyTimes="0;.62;.66;.95;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="360" fill="#030507"/>
  <rect x="20" y="20" width="1160" height="320" rx="12" fill="url(#bg)" stroke="#1F3A2A" stroke-width="2"/>

  <g clip-path="url(#win)">
    <g fill="#4ADE80" opacity="0.10" font-size="16">
      <g class="rain1"><text x="640" y="0">1<tspan x="640" dy="20">0</tspan><tspan x="640" dy="20">1</tspan><tspan x="640" dy="20">1</tspan><tspan x="640" dy="20">0</tspan><tspan x="640" dy="20">0</tspan><tspan x="640" dy="20">1</tspan><tspan x="640" dy="20">0</tspan><tspan x="640" dy="20">1</tspan><tspan x="640" dy="20">1</tspan><tspan x="640" dy="20">0</tspan><tspan x="640" dy="20">1</tspan></text></g>
      <g class="rain2"><text x="760" y="0">0<tspan x="760" dy="20">1</tspan><tspan x="760" dy="20">0</tspan><tspan x="760" dy="20">0</tspan><tspan x="760" dy="20">1</tspan><tspan x="760" dy="20">1</tspan><tspan x="760" dy="20">0</tspan><tspan x="760" dy="20">1</tspan><tspan x="760" dy="20">0</tspan><tspan x="760" dy="20">0</tspan><tspan x="760" dy="20">1</tspan><tspan x="760" dy="20">0</tspan></text></g>
      <g class="rain3"><text x="840" y="0">1<tspan x="840" dy="20">1</tspan><tspan x="840" dy="20">0</tspan><tspan x="840" dy="20">1</tspan><tspan x="840" dy="20">0</tspan><tspan x="840" dy="20">1</tspan><tspan x="840" dy="20">1</tspan><tspan x="840" dy="20">0</tspan><tspan x="840" dy="20">0</tspan><tspan x="840" dy="20">1</tspan><tspan x="840" dy="20">1</tspan><tspan x="840" dy="20">0</tspan></text></g>
      <g class="rain2"><text x="1170" y="0">0<tspan x="1170" dy="20">1</tspan><tspan x="1170" dy="20">1</tspan><tspan x="1170" dy="20">0</tspan><tspan x="1170" dy="20">1</tspan><tspan x="1170" dy="20">0</tspan><tspan x="1170" dy="20">0</tspan><tspan x="1170" dy="20">1</tspan><tspan x="1170" dy="20">1</tspan><tspan x="1170" dy="20">0</tspan><tspan x="1170" dy="20">1</tspan><tspan x="1170" dy="20">0</tspan></text></g>
    </g>

    <rect x="20" y="20" width="1160" height="36" fill="#0F1A14"/>
    <circle cx="46" cy="38" r="6" fill="#FF5F56"/>
    <circle cx="68" cy="38" r="6" fill="#FFBD2E"/>
    <circle cx="90" cy="38" r="6" fill="#27C93F"/>
    <text x="600" y="43" text-anchor="middle" font-size="14" fill="#6B8F7A">nicollascamargo@github: ~/data</text>

    <g class="glow" font-size="22">
      <g clip-path="url(#c1)"><text x="60" y="96" textLength="304" lengthAdjust="spacing"><tspan fill="#22D3EE">nicollas@data</tspan><tspan fill="#9CA3AF">:~$ </tspan><tspan fill="#4ADE80">whoami</tspan></text></g>
    </g>
    <g clip-path="url(#c2)"><text class="glow" x="60" y="150" font-size="52" font-weight="700" fill="#F0FDF4" textLength="500" lengthAdjust="spacing">Nicollas Camargo</text></g>
    <g clip-path="url(#c3)"><text x="60" y="186" font-size="20" fill="#FBBF24" textLength="600" lengthAdjust="spacing">Data Science · Data Engineering · Machine Learning</text></g>

    <g font-size="22">
      <g clip-path="url(#c4)"><text x="60" y="232" textLength="396" lengthAdjust="spacing"><tspan fill="#22D3EE">nicollas@data</tspan><tspan fill="#9CA3AF">:~$ </tspan><tspan fill="#4ADE80">cat stack.txt</tspan></text></g>
    </g>
    <g clip-path="url(#c5)"><text x="60" y="268" font-size="20" fill="#A7F3D0" textLength="684" lengthAdjust="spacing">python · sql · pandas · scikit-learn · fastapi · power bi</text></g>
    <g clip-path="url(#c6)"><text x="60" y="312" font-size="22" textLength="224" lengthAdjust="spacing"><tspan fill="#22D3EE">nicollas@data</tspan><tspan fill="#9CA3AF">:~$ </tspan></text></g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.661;.95;1" dur="16s" repeatCount="indefinite"/>
      <rect class="blink" x="288" y="294" width="12" height="22" fill="#4ADE80"/>
    </g>

    <g transform="translate(880 100)">
      <text x="0" y="-16" font-size="14" fill="#22D3EE">// walk-forward forecast</text>
      <g stroke="#1F3A2A" stroke-width="1">
        <path d="M0 0V190H270"/>
        <path d="M0 48H270M0 95H270M0 142H270" stroke-dasharray="3 5" opacity="0.6"/>
      </g>
      <path d="M0 160 L40 140 L80 150 L120 108 L160 118 L200 78" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" pathLength="400" stroke-dasharray="400" stroke-dashoffset="400">
        <animate attributeName="stroke-dashoffset" values="400;400;0;0;400" keyTimes="0;.18;.58;.95;1" dur="16s" repeatCount="indefinite"/>
      </path>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.60;.66;.95;1" dur="16s" repeatCount="indefinite"/>
        <path d="M200 78 L235 58 L270 36" fill="none" stroke="#22D3EE" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
        <path d="M200 78 L235 40 L270 0 L270 72 L235 76 Z" fill="#22D3EE" opacity="0.12"/>
        <circle class="pulse" cx="270" cy="36" r="5" fill="#22D3EE"/>
      </g>
      <g fill="#4ADE80">
        <circle cx="200" cy="78" r="4"/>
      </g>
      <g font-size="12" fill="#6B8F7A">
        <text x="0" y="212">train</text>
        <text x="200" y="212" fill="#22D3EE">forecast →</text>
      </g>
    </g>

    <rect class="scan" x="20" y="0" width="1160" height="3" fill="#4ADE80" opacity="0.06"/>
  </g>
</svg>
