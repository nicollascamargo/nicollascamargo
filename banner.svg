<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050D"/>
      <stop offset="100%" stop-color="#0C1236"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.75" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#FFB36B"/>
      <stop offset="60%" stop-color="#D2561F"/>
      <stop offset="100%" stop-color="#4A1708"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <rect width="1200" height="300" fill="url(#neb1)"/>
  <rect width="1200" height="300" fill="url(#neb2)"/>

  <g fill="#FFFFFF">
    <circle cx="40" cy="30" r="1.4"/><circle cx="110" cy="85" r="1"/><circle cx="170" cy="22" r="1.8" opacity="0.8"/>
    <circle cx="230" cy="140" r="1"/><circle cx="290" cy="50" r="1.3"/><circle cx="340" cy="210" r="1"/>
    <circle cx="395" cy="95" r="1.6" opacity="0.7"/><circle cx="450" cy="30" r="1"/><circle cx="500" cy="250" r="1.4"/>
    <circle cx="560" cy="60" r="1"/><circle cx="620" cy="270" r="1.8" opacity="0.8"/><circle cx="680" cy="35" r="1.2"/>
    <circle cx="740" cy="120" r="1"/><circle cx="800" cy="20" r="1.5"/><circle cx="850" cy="240" r="1"/>
    <circle cx="910" cy="70" r="1.3"/><circle cx="960" cy="280" r="1.6" opacity="0.7"/><circle cx="1010" cy="40" r="1"/>
    <circle cx="1070" cy="110" r="1.4"/><circle cx="1130" cy="30" r="1"/><circle cx="1170" cy="180" r="1.6"/>
    <circle cx="70" cy="200" r="1.2"/><circle cx="140" cy="260" r="1"/><circle cx="260" cy="275" r="1.4"/>
    <circle cx="420" cy="165" r="1"/><circle cx="590" cy="150" r="1.2"/><circle cx="770" cy="200" r="1"/>
    <circle cx="1040" cy="230" r="1.2"/><circle cx="1110" cy="270" r="1"/>
  </g>

  <g transform="translate(1030 150)">
    <ellipse cx="0" cy="0" rx="120" ry="26" fill="none" stroke="#9BE7FF" stroke-opacity="0.35" stroke-width="5" transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="62" fill="url(#planet)"/>
    <path d="M-120 30 A120 26 0 0 0 120 -30" fill="none" stroke="#9BE7FF" stroke-opacity="0.55" stroke-width="5" transform="rotate(-18) translate(0 0)" opacity="0"/>
  </g>

  <text x="60" y="95" font-family="Courier New, monospace" font-size="16" letter-spacing="6" fill="#00E5FF" opacity="0.9">// MISSION LOG: DATA EXPEDITION</text>
  <text x="60" y="165" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" filter="url(#glow)">Nicollas Camargo</text>
  <text x="60" y="215" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#FFB36B">Data Science · Data Engineering · Machine Learning</text>
  <line x1="60" y1="240" x2="420" y2="240" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2"/>
</svg>
