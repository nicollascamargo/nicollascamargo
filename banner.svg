<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <style>
    .tw1{animation:tw 3s ease-in-out infinite}
    .tw2{animation:tw 4.5s ease-in-out infinite 1s}
    .tw3{animation:tw 2.2s ease-in-out infinite .5s}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}

    .shoot{opacity:0;animation:shoot 7s linear infinite}
    .s2{animation-delay:2.6s}
    .s3{animation-delay:4.9s}
    @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}13%{transform:translate(420px,210px);opacity:0}100%{transform:translate(420px,210px);opacity:0}}

    .neb{animation:drift 16s ease-in-out infinite alternate}
    @keyframes drift{from{transform:translate(-40px,0)}to{transform:translate(40px,14px)}}

    .spin{animation:spin 14s linear infinite}
    @keyframes spin{from{transform:translateX(0)}to{transform:translateX(-90px)}}

    .ringglow{animation:rg 3.5s ease-in-out infinite}
    @keyframes rg{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.8}}

    .flame{transform-box:fill-box;transform-origin:right center;animation:fl .12s ease-in-out infinite alternate}
    @keyframes fl{from{transform:scaleX(.5)}to{transform:scaleX(1.3)}}

    .role{opacity:0;animation:role 9s infinite}
    .r2{animation-delay:3s}
    .r3{animation-delay:6s}
    @keyframes role{0%{opacity:0;transform:translateY(12px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-12px)}}

    .blink{animation:blink .9s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    .glow{animation:glow 4s ease-in-out infinite}
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 3px #00E5FF)}50%{filter:drop-shadow(0 0 14px #7C5CFF)}}

    .scan{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(360px)}}

    .dash{stroke-dasharray:14 10;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}

    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050D"/>
      <stop offset="100%" stop-color="#0C1236"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.8" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#FFC58A"/>
      <stop offset="60%" stop-color="#D2561F"/>
      <stop offset="100%" stop-color="#4A1708"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.3" cy="0.3" r="0.85">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="tail" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pclip"><circle cx="0" cy="0" r="62"/></clipPath>
    <clipPath id="tclip">
      <rect x="55" y="95" height="95" width="0">
        <animate attributeName="width" values="0;720;720;0" keyTimes="0;0.38;0.92;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <g id="blot">
      <ellipse cx="20" cy="-30" rx="24" ry="7" fill="#7A2A0C" opacity="0.55"/>
      <ellipse cx="55" cy="-8" rx="30" ry="6" fill="#FFD9A8" opacity="0.35"/>
      <ellipse cx="30" cy="16" rx="26" ry="8" fill="#7A2A0C" opacity="0.5"/>
      <ellipse cx="65" cy="38" rx="22" ry="6" fill="#FFD9A8" opacity="0.3"/>
    </g>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <g class="neb">
    <rect x="-60" y="-20" width="1320" height="380" fill="url(#neb1)"/>
    <rect x="-60" y="-20" width="1320" height="380" fill="url(#neb2)"/>
  </g>

  <g fill="#FFFFFF">
    <circle class="tw1" cx="40" cy="30" r="1.4"/><circle class="tw2" cx="110" cy="85" r="1"/><circle class="tw3" cx="170" cy="22" r="1.8"/>
    <circle class="tw1" cx="230" cy="150" r="1"/><circle class="tw2" cx="290" cy="50" r="1.3"/><circle class="tw3" cx="340" cy="230" r="1"/>
    <circle class="tw1" cx="395" cy="105" r="1.6"/><circle class="tw2" cx="450" cy="30" r="1"/><circle class="tw3" cx="500" cy="280" r="1.4"/>
    <circle class="tw1" cx="560" cy="60" r="1"/><circle class="tw2" cx="620" cy="300" r="1.8"/><circle class="tw3" cx="680" cy="35" r="1.2"/>
    <circle class="tw1" cx="740" cy="130" r="1"/><circle class="tw2" cx="800" cy="20" r="1.5"/><circle class="tw3" cx="850" cy="260" r="1"/>
    <circle class="tw1" cx="910" cy="70" r="1.3"/><circle class="tw2" cx="960" cy="310" r="1.6"/><circle class="tw3" cx="1010" cy="40" r="1"/>
    <circle class="tw1" cx="1090" cy="300" r="1.4"/><circle class="tw2" cx="1140" cy="30" r="1"/><circle class="tw3" cx="1175" cy="200" r="1.6"/>
    <circle class="tw2" cx="70" cy="220" r="1.2"/><circle class="tw3" cx="140" cy="290" r="1"/><circle class="tw1" cx="260" cy="315" r="1.4"/>
    <circle class="tw3" cx="420" cy="185" r="1"/><circle class="tw1" cx="590" cy="160" r="1.2"/><circle class="tw2" cx="770" cy="220" r="1"/>
    <circle class="tw1" cx="1050" cy="20" r="1.2"/><circle class="tw3" cx="1120" cy="315" r="1"/>
  </g>

  <g transform="translate(120 10)"><g class="shoot"><line x1="0" y1="0" x2="-90" y2="-45" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/><circle cx="0" cy="0" r="2.2" fill="#fff"/></g></g>
  <g transform="translate(380 0)"><g class="shoot s2"><line x1="0" y1="0" x2="-90" y2="-45" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/><circle cx="0" cy="0" r="2.2" fill="#fff"/></g></g>
  <g transform="translate(40 120)"><g class="shoot s3"><line x1="0" y1="0" x2="-90" y2="-45" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/><circle cx="0" cy="0" r="2.2" fill="#fff"/></g></g>

  <g transform="translate(1040 170)">
    <g class="float">
      <g transform="rotate(-18)">
        <ellipse cx="0" cy="0" rx="125" ry="28" fill="none" stroke="#9BE7FF" stroke-width="6" class="ringglow"/>
        <ellipse cx="0" cy="0" rx="145" ry="33" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-opacity="0.45"/>
      </g>
      <circle cx="0" cy="0" r="62" fill="url(#planet)"/>
      <g clip-path="url(#pclip)">
        <g class="spin">
          <use href="#blot" x="-90"/><use href="#blot" x="-10"/><use href="#blot" x="70"/><use href="#blot" x="150"/><use href="#blot" x="230"/>
        </g>
      </g>
      <circle cx="0" cy="0" r="62" fill="url(#shade)"/>
      <g transform="rotate(-18)">
        <path d="M-125 0 A125 28 0 0 0 125 0" fill="none" stroke="#9BE7FF" stroke-width="6" class="ringglow"/>
      </g>
      <g transform="rotate(-18)">
        <circle r="7" fill="#DDE8FF">
          <animateMotion dur="8s" repeatCount="indefinite" path="M170 0 A170 40 0 1 1 -170 0 A170 40 0 1 1 170 0"/>
        </circle>
      </g>
    </g>
  </g>

  <g>
    <animateMotion dur="15s" repeatCount="indefinite" rotate="auto" path="M-80 310 C 300 250, 800 330, 1300 200"/>
    <polygon points="0,0 -26,-9 -20,0 -26,9" fill="#E8F1FF"/>
    <polygon points="-6,0 -20,-4 -20,4" fill="#00E5FF"/>
    <polygon class="flame" points="-24,-3 -50,0 -24,3" fill="#FF8A3D"/>
  </g>

  <text x="60" y="80" font-family="Courier New, monospace" font-size="16" letter-spacing="6" fill="#00E5FF" opacity="0.95">// MISSION LOG: DATA EXPEDITION<tspan class="blink">_</tspan></text>

  <g clip-path="url(#tclip)">
    <text class="glow" x="60" y="165" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF">Nicollas Camargo</text>
  </g>
  <rect x="60" y="112" width="6" height="64" fill="#00E5FF" class="blink">
    <animate attributeName="x" values="60;770;770;60" keyTimes="0;0.38;0.92;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#FFB36B">
    <text class="role" x="62" y="225">▸ Data Science</text>
    <text class="role r2" x="62" y="225">▸ Data Engineering</text>
    <text class="role r3" x="62" y="225">▸ Machine Learning</text>
  </g>

  <line class="dash" x1="60" y1="256" x2="520" y2="256" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="2"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00E5FF" opacity="0.08"/>
</svg>
